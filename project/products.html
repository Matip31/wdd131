<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This site is the main page for a Mate Store, which contains information about the store, the products and also a way to contact us">
    <meta name="author" content="Matias Ponce">
    <link rel="stylesheet" href="styles/site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>MateMatiCrazy</title>
    <script src="scripts/mate-products.js" defer></script>
</head>
<body>
    <header>
        <div class="title">
            <img src="images/MateMatiCrazy-logo.webp" alt="Store Logo">
            <h1>MateMatiCrazy</h1>
        </div>
        <button id="ham" aria-label="Open navigation menu"></button>
        <div class="div-container">
            <nav>
                <ul class="navigation">
                    <li>
                        <a href="index.html" id="home">Home</a>
                    </li>
                    <li>
                        <a href="products.html" id="products">Products</a>
                    </li>
                    <li>
                        <a href="contact.html" id="contactUs">Contact Us!</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <picture>
                <img src="images/background-mate.webp" alt="background-mate" id="bck">
            </picture>
        </section>
        <section class="products">
            <h2>The best Products!</h2>
            <div class="container-products">
            </div>
        </section>
        <section class="filter">
            <h2>Select the category: </h2>
            <nav>
                <ul class="filter-nav">
                    <li>
                        <a href="#" id="all">All</a>
                    </li>
                    <li>
                        <a href="#" id="mate">Mates</a>
                    </li>
                    <li>
                        <a href="#" id="thermos">Thermos</a>
                    </li>
                    <li>
                        <a href="#" id="materas">Materas</a>
                    </li>
                </ul>
            </nav>
        </section>
        <a href="contact.html" class="contact-button">Contact Us!</a>
    </main>
    <footer>
        <p>
            © <span id="currentyear"></span> Matias Ponce | Uruguay
        </p>
    </footer>
</body>
</html>
